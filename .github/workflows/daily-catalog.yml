name: Refresh official catalog and publish Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-catalog.yml'
      - '.github/workflows/catalog-clock.yml'
      - 'scripts/**'
      - 'index.html'
      - 'assets/**'
      - 'official-catalog.json'
  schedule:
    # Recovery trigger; the early clock normally dispatches collection at 10:03 KST.
    - cron: '10 1 * * *'
  workflow_dispatch:
    inputs:
      publication_mode:
        description: Immediate publication, or wait for today's 10:10 KST target
        type: choice
        default: immediate
        options: [immediate, scheduled]
      scheduled_for:
        description: Target ISO timestamp supplied by the early clock (optional)
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

# The long early-clock wait is separate and does not hold this publication lock.
concurrency:
  group: github-pages-daily-catalog
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      mode: ${{ steps.plan.outputs.mode }}
      target_at: ${{ steps.plan.outputs.target_at }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Skip scheduled publication only after a healthy successful deployment
        id: plan
        env:
          PUBLICATION_MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.publication_mode || 'immediate' }}
          SCHEDULED_FOR: ${{ inputs.scheduled_for || '' }}
        run: python scripts/catalog_schedule.py plan --root . --mode "$PUBLICATION_MODE" --scheduled-for "$SCHEDULED_FOR"

  publish:
    needs: plan
    if: needs.plan.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify catalog updater and scheduling boundaries
        run: python -m unittest discover -s scripts/tests -v
      - name: Refresh official product information
        id: sync
        # Preserve and publish the health report even when every official request fails.
        continue-on-error: true
        run: python scripts/catalog_sync.py --root . --max-new 8
      - name: Validate retained public catalog and health report
        id: health
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          catalog = json.loads(Path('official-catalog.json').read_text(encoding='utf-8'))
          status = json.loads(Path('sync-status.json').read_text(encoding='utf-8'))
          assert isinstance(catalog, list) and catalog, 'Never publish an empty catalog'
          assert status['status'] in {'ok', 'partial', 'failed'}
          pending = sum(bool(product.get('translationPending')) for product in catalog)
          needs_attention = (os.environ['SYNC_OUTCOME'] != 'success' or status['status'] != 'ok'
                             or status['failed'] != 0 or pending != 0
                             or status.get('translation', {}).get('pending', 0) != pending)
          report = json.dumps({'status': status['status'], 'checked': status['checked'],
                               'added': status['added'], 'failed': status['failed'],
                               'translationPending': pending}, separators=(',', ':'))
          print('Catalog check: ' + report)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'needs_attention={str(needs_attention).lower()}\nhealth_report={report}\n')
          PY
      - name: Commit changed catalog, immutable assets and health report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- official-catalog.json sync-status.json translation-cache.json series/official
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official kuji catalog"
            git push origin HEAD:main
          fi
      - name: Assemble the existing static application with refreshed data
        run: |
          mkdir _site
          cp index.html official-catalog.json sync-status.json _site/
          cp -R assets series _site/
          find . -maxdepth 1 -type f \( -name '*.svg' -o -name '*.ico' -o -name '*.png' -o -name '*.txt' -o -name '.nojekyll' \) -exec cp {} _site/ \;
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Keep the prepared publication until 10:10 KST
        if: needs.plan.outputs.mode == 'scheduled'
        env:
          TARGET_AT: ${{ needs.plan.outputs.target_at }}
        run: python scripts/catalog_schedule.py gate --target "$TARGET_AT" --max-wait-seconds 600
      # Artifact upload, clock gate and publication share a runner.
      - name: Publish refreshed catalog and sync health
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record the scheduled result only after publication succeeds
        if: needs.plan.outputs.mode == 'scheduled'
        env:
          TARGET_AT: ${{ needs.plan.outputs.target_at }}
          HEALTHY: ${{ steps.health.outputs.needs_attention == 'false' && 'true' || 'false' }}
        run: |
          git pull --ff-only origin main
          python scripts/catalog_schedule.py record --root . --target "$TARGET_AT" --healthy "$HEALTHY"
          git add -- .github/catalog-publication.json
          if ! git diff --cached --quiet; then
            git commit -m "Record scheduled catalog publication"
            git push origin HEAD:main
          fi
      - name: Report incomplete refresh after preserving the published site
        if: steps.health.outputs.needs_attention == 'true'
        env:
          HEALTH_REPORT: ${{ steps.health.outputs.health_report }}
        run: |
          printf '%s\n' "$HEALTH_REPORT"
          echo '::error::Official refresh or Korean translation is incomplete. Retained data and health status were published; the next daily run will retry.'
          exit 1
